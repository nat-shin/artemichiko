<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    ArteMichiko — sello maskable (safe zone 80%, contenido dentro del círculo central).
    Fondo completo #11110E (theme_color); trazos lienzo #FDFBF7; gancho jade #00A86B.
    Contenido escalado a 0.55 para sobrevivir recortes de Android/iOS sin pérdida.
  -->
  <rect width="128" height="128" fill="#11110E" />
  <g transform="translate(28.8 28.8) scale(0.55)">
    <rect x="22" y="22" width="84" height="84" rx="12" fill="#FDFBF7" stroke="#11110E" stroke-width="4.5" />
    <rect x="31" y="31" width="66" height="66" rx="8" fill="none" stroke="#11110E" stroke-opacity="0.22" stroke-width="1.5" />
    <g fill="none" stroke="#11110E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 40 L46 66" />
      <path d="M56 52 L45 58" stroke-width="4" />
      <path d="M60 58 L50 66" stroke-width="4" />
      <path d="M64 64 L56 72" stroke-width="4" />
      <path d="M84 46 V88" />
    </g>
    <path d="M84 88 H70" fill="none" stroke="#00A86B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
